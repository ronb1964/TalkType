[tool.poetry]
name = "talktype"
version = "0.7.1"
description = "Press-and-hold dictation for Wayland (F8), Faster-Whisper + ydotool, with smart punctuation."
authors = ["Ron"]
license = "MIT"
readme = "README.md"
packages = [{ include = "talktype", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"  # Dev: 3.14 (Nobara 42), AppImage: 3.10 (Ubuntu 22.04)
faster-whisper = "*"
sounddevice = "*"
evdev = "*"
numpy = "*"
pyperclip = "*"
toml = "*"
# pygobject - using system package (copied manually in build script)
# pycairo - using system package (copied manually in build script)
# NOTE: torch was removed 2026-08-15 — it was never actually used. Inference runs on
# faster-whisper/CTranslate2; GPU uses CTranslate2's CUDA libs (downloaded at runtime by
# cuda_helper.py); model downloads use huggingface_hub. Verified torch-free on CPU and on
# GPU (RTX 4070 SUPER). Removing it cut the packaged size by ~170 MB (.deb 302 MB → 133 MB).

[tool.poetry.scripts]
dictate-tray = "talktype.tray:main"
dictate = "talktype.app:main"
dictate-prefs = "talktype.prefs:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
black = "^25.1.0"
ruff = "^0.12.9"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E","F","I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
